    <style>:root {
  color-scheme: light;
  font-family: Inter, Aptos, "Segoe UI", system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
  --pb-bg: #eef1ed;
  --pb-ink: #111816;
  --pb-muted: #66716b;
  --pb-soft: #f8faf7;
  --pb-panel: #ffffff;
  --pb-panel-alt: #e3e8e2;
  --pb-rail: #101614;
  --pb-rail-2: #17231e;
  --pb-rule: #cbd3ca;
  --pb-green: #1f7a4d;
  --pb-green-soft: #d8efe1;
  --pb-amber: #9b6816;
  --pb-amber-soft: #f4e7c8;
  --pb-blue: #245f78;
  --pb-blue-soft: #d9e9ef;
  --pb-red: #9b3d38;
  --pb-red-soft: #ecd9d6;
  --pb-radius-sm: 4px;
  --pb-radius-md: 8px;
  --pb-shadow: 0 18px 46px rgba(17, 24, 22, 0.1);
  background: var(--pb-bg);
  color: var(--pb-ink);
  font-synthesis: none;
  text-rendering: optimizeLegibility;
}

* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body {
  min-width: 320px;
  min-height: 100vh;
  margin: 0;
  background:
    linear-gradient(90deg, rgba(17, 24, 22, 0.05) 1px, transparent 1px) 0 0 / 52px 52px,
    linear-gradient(180deg, #f8faf7 0, var(--pb-bg) 42%, #e5ebe5 100%);
  color: var(--pb-ink);
}

button, a, select { font: inherit; }
a { color: inherit; text-decoration: none; }
h1, h2, h3, p { margin: 0; }

.app-shell {
  width: min(1240px, calc(100% - 32px));
  margin: 0 auto;
  padding: 18px 0 34px;
}

.topbar, .brand, .nav-actions, .hero-actions, .console-head, .console-foot, .panel-header, .footer {
  display: flex;
  align-items: center;
}

.topbar {
  position: sticky;
  top: 0;
  z-index: 10;
  justify-content: space-between;
  gap: 16px;
  min-height: 68px;
  padding: 10px 0;
  border-bottom: 1px solid rgba(17, 24, 22, 0.16);
  background: rgba(238, 241, 237, 0.9);
  backdrop-filter: blur(12px);
}

.brand { gap: 12px; min-width: max-content; }
.brand-mark {
  display: grid;
  width: 42px;
  height: 42px;
  place-items: center;
  color: #f5fbf6;
  background: var(--pb-rail);
  border: 1px solid rgba(255, 255, 255, 0.12);
  border-radius: var(--pb-radius-md);
  font-family: "Cascadia Code", "SFMono-Regular", Consolas, monospace;
  font-weight: 800;
}
.brand-copy { display: grid; gap: 1px; }
.brand-copy small, .rail-label, .section-label, .panel-label, .evidence-state, .endpoint-name span, .footer, .release-ledger span, .lifecycle-step time, .boundary-list span {
  color: var(--pb-muted);
  font-size: 0.76rem;
  line-height: 1.35;
}
.brand-copy small { color: #52615a; }

.nav-actions { flex-wrap: wrap; justify-content: flex-end; gap: 8px; }
.nav-link, .lang-select, .primary-button, .secondary-button, .ghost-button {
  min-height: 38px;
  padding: 0 13px;
  border: 1px solid var(--pb-rule);
  border-radius: var(--pb-radius-sm);
  background: rgba(248, 250, 247, 0.84);
  color: var(--pb-ink);
}
.nav-link, .primary-button, .secondary-button, .ghost-button {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  font-weight: 750;
}
.nav-link:hover, .secondary-button:hover, .ghost-button:hover, .text-link:hover { border-color: rgba(36, 95, 120, 0.45); color: var(--pb-blue); }
.lang-select { cursor: pointer; }

.ops-hero {
  display: grid;
  grid-template-columns: 230px minmax(0, 1fr) minmax(360px, 0.72fr);
  gap: 18px;
  min-height: calc(100vh - 122px);
  padding: 34px 0 24px;
  align-items: stretch;
}

.command-rail, .probe-console {
  overflow: hidden;
  border-radius: var(--pb-radius-md);
  box-shadow: var(--pb-shadow);
}
.command-rail {
  display: grid;
  align-content: start;
  gap: 12px;
  padding: 18px;
  color: #e9f4ed;
  background: linear-gradient(180deg, var(--pb-rail), var(--pb-rail-2));
  border: 1px solid rgba(255, 255, 255, 0.12);
}
.rail-label, .command-rail span { color: #91a39a; }
.rail-label, .section-label, .panel-label, .evidence-state {
  font-family: "Cascadia Code", "SFMono-Regular", Consolas, monospace;
  letter-spacing: 0;
  text-transform: uppercase;
}
.rail-meter, .deploy-gate {
  display: grid;
  gap: 7px;
  padding: 14px;
  border: 1px solid rgba(255, 255, 255, 0.12);
  border-radius: var(--pb-radius-sm);
  background: rgba(255, 255, 255, 0.05);
}
.rail-meter strong { font-size: 1.22rem; }
.deploy-gate { margin-top: 12px; }
.deploy-gate strong { font-size: 0.86rem; line-height: 1.45; }

.hero-copy {
  display: grid;
  align-content: center;
  min-width: 0;
  padding: 42px;
  background: var(--pb-panel);
  border: 1px solid var(--pb-rule);
  border-radius: var(--pb-radius-md);
  box-shadow: var(--pb-shadow);
}
.kicker {
  width: max-content;
  max-width: 100%;
  margin-bottom: 18px;
  padding: 7px 10px;
  color: var(--pb-green);
  background: var(--pb-green-soft);
  border: 1px solid rgba(31, 122, 77, 0.22);
  border-radius: var(--pb-radius-sm);
  font-family: "Cascadia Code", "SFMono-Regular", Consolas, monospace;
  font-size: 0.78rem;
  font-weight: 800;
  text-transform: uppercase;
}
h1 {
  max-width: 780px;
  font-size: clamp(2.6rem, 6.2vw, 6.8rem);
  line-height: 0.92;
  letter-spacing: 0;
}
.lead {
  max-width: 760px;
  margin-top: 22px;
  color: #3f4b45;
  font-size: clamp(1.02rem, 1.7vw, 1.19rem);
  line-height: 1.72;
}
.hero-actions { flex-wrap: wrap; gap: 10px; margin-top: 28px; }
.primary-button { color: #f8faf7; background: var(--pb-rail); border-color: var(--pb-rail); }
.secondary-button { color: var(--pb-blue); background: var(--pb-blue-soft); border-color: rgba(36, 95, 120, 0.18); }
.ghost-button { cursor: pointer; }

.probe-console {
  display: grid;
  grid-template-rows: auto 1fr auto;
  background: #fdfefb;
  border: 1px solid var(--pb-rule);
}
.console-head, .console-foot {
  justify-content: space-between;
  gap: 12px;
  padding: 14px 16px;
  border-bottom: 1px solid var(--pb-rule);
}
.console-head span { font-weight: 800; text-transform: uppercase; }
.console-foot { flex-wrap: wrap; border-top: 1px solid var(--pb-rule); border-bottom: 0; }
code, .terminal, .endpoint-row code, .lifecycle-step time, .release-ledger strong, .boundary-list span {
  font-family: "Cascadia Code", "SFMono-Regular", Consolas, monospace;
}
.terminal { display: grid; align-content: start; padding: 10px 0; color: var(--pb-ink); }
.terminal-line {
  display: grid;
  grid-template-columns: 28px minmax(138px, 1fr) auto auto;
  gap: 10px;
  align-items: center;
  min-height: 52px;
  padding: 0 16px;
  border-bottom: 1px solid rgba(203, 211, 202, 0.72);
  font-size: 0.85rem;
}
.terminal-line:last-child { border-bottom: 0; }
.prompt { color: var(--pb-blue); font-weight: 800; }
.latency { color: var(--pb-muted); text-align: right; }
.endpoint-status {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-width: 78px;
  min-height: 26px;
  padding: 3px 8px;
  border: 1px solid transparent;
  border-radius: var(--pb-radius-sm);
  font-family: "Cascadia Code", "SFMono-Regular", Consolas, monospace;
  font-size: 0.72rem;
  font-weight: 800;
}
.endpoint-status.good { color: var(--pb-green); background: var(--pb-green-soft); border-color: rgba(31, 122, 77, 0.26); }
.endpoint-status.warn { color: var(--pb-amber); background: var(--pb-amber-soft); border-color: rgba(155, 104, 22, 0.22); }
.endpoint-status.bad { color: var(--pb-red); background: var(--pb-red-soft); border-color: rgba(155, 61, 56, 0.26); }

.evidence-rail, .architecture-band, .surface-grid, .operations-band { margin-top: 22px; }
.evidence-rail, .architecture-band, .surface-panel, .lifecycle-card, .deployment-card {
  background: rgba(255, 255, 255, 0.86);
  border: 1px solid var(--pb-rule);
  border-radius: var(--pb-radius-md);
  box-shadow: 0 1px 0 rgba(17, 24, 22, 0.06);
}
.evidence-rail, .architecture-band { padding: 24px; }
.section-heading {
  display: grid;
  grid-template-columns: minmax(150px, 0.28fr) minmax(0, 1fr);
  gap: 20px;
  align-items: start;
  padding-bottom: 22px;
  border-bottom: 1px solid var(--pb-rule);
}
.section-heading h2, .panel-header h2, .lifecycle-card h2, .deployment-card h2 {
  font-size: clamp(1.45rem, 2.6vw, 2.15rem);
  line-height: 1.05;
}
.evidence-rail ul {
  display: grid;
  grid-template-columns: repeat(5, minmax(0, 1fr));
  gap: 0;
  padding: 0;
  margin: 0;
  list-style: none;
}
.evidence-item { min-height: 150px; padding: 18px 16px; border-right: 1px solid var(--pb-rule); }
.evidence-item:last-child { border-right: 0; }
.evidence-item strong, .evidence-item span:last-child { display: block; }
.evidence-item strong { margin: 10px 0 9px; font-size: 1rem; }
.evidence-item span:last-child { color: #46524d; line-height: 1.45; }

.surface-grid, .operations-band { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 22px; }
.surface-panel, .lifecycle-card, .deployment-card { padding: 24px; }
.panel-header { justify-content: space-between; gap: 20px; padding-bottom: 18px; border-bottom: 1px solid var(--pb-rule); }
.panel-header + p, .lifecycle-card p, .deployment-card p { margin-top: 18px; color: #45524b; line-height: 1.65; }
.status-badge {
  min-width: max-content;
  padding: 6px 10px;
  color: var(--pb-blue);
  background: var(--pb-blue-soft);
  border: 1px solid rgba(36, 95, 120, 0.18);
  border-radius: var(--pb-radius-sm);
  font-size: 0.76rem;
  font-weight: 800;
}
.release-ledger, .backend-stack, .boundary-list { display: grid; gap: 8px; margin-top: 22px; }
.release-ledger {
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 0;
  border: 1px solid var(--pb-rule);
  border-radius: var(--pb-radius-sm);
  overflow: hidden;
}
.release-ledger div { display: grid; gap: 6px; padding: 14px; border-right: 1px solid var(--pb-rule); background: rgba(227, 232, 226, 0.46); }
.release-ledger div:last-child { border-right: 0; }
.release-ledger strong { font-size: 0.83rem; }
.text-link { display: inline-flex; width: max-content; margin-top: 18px; color: var(--pb-blue); font-weight: 800; }
.endpoint-row {
  display: grid;
  grid-template-columns: minmax(150px, 1fr) minmax(120px, auto) auto;
  gap: 14px;
  align-items: center;
  min-height: 62px;
  padding: 12px 14px;
  border: 1px solid var(--pb-rule);
  border-radius: var(--pb-radius-sm);
  background: rgba(238, 241, 237, 0.56);
}
.endpoint-row:hover { border-color: rgba(36, 95, 120, 0.38); }
.endpoint-name { display: grid; gap: 3px; }
.endpoint-row code { color: var(--pb-blue); font-size: 0.82rem; }

.architecture-band { display: grid; gap: 24px; }
.architecture-map {
  display: grid;
  grid-template-columns: 1fr 28px 1fr 28px 1fr 28px 1fr 28px 1fr;
  align-items: center;
  gap: 0;
}
.architecture-node {
  display: grid;
  min-height: 118px;
  align-content: center;
  gap: 8px;
  padding: 16px;
  background: var(--pb-panel-alt);
  border: 1px solid var(--pb-rule);
  border-radius: var(--pb-radius-md);
}
.architecture-node strong { font-size: 1rem; }
.architecture-node span { color: #53615a; font-size: 0.82rem; }
.architecture-node.api, .architecture-node.worker { background: #dbe9e3; }
.architecture-node.redis { background: #efe8d5; }
.architecture-link { height: 2px; background: var(--pb-rule); }

.lifecycle-card ol { display: grid; gap: 12px; padding: 0; margin: 22px 0 0; list-style: none; }
.lifecycle-step {
  display: grid;
  grid-template-columns: 46px minmax(0, 1fr);
  gap: 14px;
  align-items: start;
  padding: 14px;
  border: 1px solid var(--pb-rule);
  border-radius: var(--pb-radius-sm);
  background: rgba(238, 241, 237, 0.5);
}
.lifecycle-step time { color: var(--pb-green); font-weight: 800; }
.lifecycle-step > span, .lifecycle-step > span > span { display: grid; gap: 4px; }
.lifecycle-step > span > span { color: #4c5852; line-height: 1.45; }
.boundary-list span { padding: 12px; color: #405049; background: rgba(227, 232, 226, 0.6); border: 1px solid var(--pb-rule); border-radius: var(--pb-radius-sm); }
.footer { justify-content: space-between; gap: 18px; padding: 24px 0 0; }
.footer a { color: var(--pb-blue); font-weight: 800; }

[dir="rtl"] .evidence-item { border-right: 0; border-left: 1px solid var(--pb-rule); }
[dir="rtl"] .evidence-item:last-child { border-left: 0; }
[dir="rtl"] .release-ledger div { border-right: 0; border-left: 1px solid var(--pb-rule); }
[dir="rtl"] .release-ledger div:last-child { border-left: 0; }

@media (max-width: 1120px) {
  .ops-hero { grid-template-columns: 1fr; min-height: 0; }
  .command-rail { grid-template-columns: repeat(4, minmax(0, 1fr)); }
  .rail-label, .deploy-gate { grid-column: 1 / -1; }
}

@media (max-width: 880px) {
  .app-shell { width: min(100% - 24px, 680px); }
  .topbar { align-items: flex-start; flex-direction: column; }
  .nav-actions { justify-content: flex-start; }
  .hero-copy { padding: 30px 24px; }
  h1 { font-size: clamp(2.35rem, 14vw, 4.6rem); }
  .command-rail, .evidence-rail ul, .surface-grid, .operations-band, .architecture-map, .release-ledger { grid-template-columns: 1fr; }
  .evidence-item, [dir="rtl"] .evidence-item { border-right: 0; border-left: 0; border-bottom: 1px solid var(--pb-rule); }
  .evidence-item:last-child { border-bottom: 0; }
  .architecture-link { width: 2px; height: 28px; justify-self: center; }
  .endpoint-row, .terminal-line { grid-template-columns: 1fr; justify-items: start; }
  .latency { text-align: left; }
  .section-heading { grid-template-columns: 1fr; }
  .panel-header { align-items: flex-start; flex-direction: column; }
  .release-ledger div, [dir="rtl"] .release-ledger div { border-right: 0; border-left: 0; border-bottom: 1px solid var(--pb-rule); }
  .release-ledger div:last-child { border-bottom: 0; }
  .footer { align-items: flex-start; flex-direction: column; }
}

@media (max-width: 520px) {
  .nav-link, .lang-select, .primary-button, .secondary-button, .ghost-button { width: 100%; }
  .nav-actions, .hero-actions { width: 100%; }
  .brand { min-width: 0; }
}</style>

}

};

let latencyMs = 0;

function readLocale() {
    const requested = new URLSearchParams(window.location.search).get('lang');
    if (requested && localeOrder.includes(requested))
        return requested;
    const stored = window.localStorage.getItem('pulseboard-locale');
    if (stored && localeOrder.includes(stored))
        return stored;
    return 'en';
}
function copy() {
    return getCopy(currentLocale);
}
function escapeHtml(value) {
    return value
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
}
function stateLabel(state) {
    return copy()[state];
}
function stateClass(state) {
    if (state === 'online' || state === 'docs')
        return 'good';
    if (state === 'checking')
        return 'warn';
    return 'bad';
}
function renderLanguageOptions() {
    return localeOrder
        .map((locale) => `<option value="${locale}" ${locale === currentLocale ? 'selected' : ''}>${escapeHtml(getCopy(locale).languageName)}</option>`)
        .join('');
}
function endpointRow(key) {

      <span class="endpoint-name">
        <strong>${escapeHtml(copy()[config.labelKey])}</strong>
        <span>${escapeHtml(config.note)}</span>
      </span>
      <code>${config.path}</code>
      <span class="endpoint-status ${stateClass(state)}">${escapeHtml(stateLabel(state))}</span>
    </a>`;
}
function renderTerminal() {
    const rows = [
        { command: 'GET /demo/health/live', value: endpointStates.live, meta: latencyMs ? `${latencyMs}ms` : '--' },
        { command: 'GET /demo/health/ready', value: endpointStates.ready, meta: lastProbeAt },
        { command: 'GET /demo/openapi.json', value: endpointStates.openapi, meta: openApiPathCount ? `${openApiPathCount} paths` : '--' },
        { command: 'GET /demo/docs', value: 'docs', meta: 'Scalar' },
    ];
    return rows
        .map((row) => `
        <div class="terminal-line">
          <span class="prompt">pb</span>
          <span>${escapeHtml(row.command)}</span>
          <strong class="endpoint-status ${stateClass(row.value)}">${escapeHtml(stateLabel(row.value))}</strong>

        .join('');
}

}

}

}
async function fetchWithTimeout(path, timeoutMs = 3500) {
    const started = performance.now();
    const controller = new AbortController();
    const timeout = window.setTimeout(() => controller.abort(), timeoutMs);
    try {
        const response = await fetch(path, { cache: 'no-store', signal: controller.signal });
        return { response, latency: Math.round(performance.now() - started) };
    }
    finally {
        window.clearTimeout(timeout);
    }
}
async function probeBackend() {
    endpointStates = { ...endpointStates, live: 'checking', ready: 'checking', openapi: 'checking' };
    render();
    try {
        const live = await fetchWithTimeout('/demo/health/live');
        endpointStates.live = live.response.ok ? 'online' : 'offline';
        latencyMs = live.latency;
    }
    catch {
        endpointStates.live = 'offline';
        latencyMs = 0;
    }
    try {
        const ready = await fetchWithTimeout('/demo/health/ready');
        endpointStates.ready = ready.response.ok ? 'online' : 'offline';
    }
    catch {
        endpointStates.ready = 'offline';
    }
    try {
        const openapi = await fetchWithTimeout('/demo/openapi.json');
        endpointStates.openapi = openapi.response.ok ? 'online' : 'offline';
        if (openapi.response.ok) {
            const document = (await openapi.response.json());
            openApiPathCount = Object.keys(document.paths ?? {}).length;
        }
        else {
            openApiPathCount = 0;
        }
    }
    catch {
        endpointStates.openapi = 'offline';
        openApiPathCount = 0;
    }
    lastProbeAt = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });
    render();
}
render();
void probeBackend();</script>
