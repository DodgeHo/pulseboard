server {
    listen 80;
    listen [::]:80;
    server_name anlan.store www.anlan.store;
    return 301 https://anlan.store$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name anlan.store www.anlan.store;

    ssl_certificate /etc/letsencrypt/live/anlan.store/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/anlan.store/privkey.pem;

    if ($host = www.anlan.store) {
        return 301 https://anlan.store$request_uri;
    }

    root /var/www/html;
    index index.html;
    charset utf-8;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    location = /heatstack {
        return 301 /heatstack/;
    }

    location = /jobs {
        return 308 /jobs/;
    }

    location /jobs/ {
        proxy_pass http://127.0.0.1:8765/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Prefix /jobs;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 300;
    }

    location = /demo {
        return 301 /demo/;
    }

    location = /demo/health/live {
        proxy_pass http://127.0.0.1:4000/health/live;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location = /demo/health/ready {
        proxy_pass http://127.0.0.1:4000/health/ready;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location = /demo/openapi.json {
        proxy_pass http://127.0.0.1:4000/openapi.json;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location = /demo/docs {
        proxy_pass http://127.0.0.1:4000/docs;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location /demo/docs/ {
        proxy_pass http://127.0.0.1:4000/docs/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location /demo/api/v1/ {
        proxy_pass http://127.0.0.1:4000/v1/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location = /health/live {
        return 301 /demo/health/live;
    }

    location = /health/ready {
        return 301 /demo/health/ready;
    }

    location = /openapi.json {
        return 301 /demo/openapi.json;
    }

    location = /docs {
        return 301 /demo/docs;
    }

    location /docs/ {
        return 301 /demo/docs/;
    }

    location = /frontend {
        return 301 /demo/frontend/;
    }

    location /frontend/ {
        return 301 /demo/frontend/;
    }

    location /v1/ {
        return 301 /demo/api$request_uri;
    }

    location /demo/ {
        try_files $uri $uri/ /demo/index.html;
    }

    location = /saa {
        return 301 /saa/;
    }

    location /saa/ {
        alias /var/www/saa/;
        index index.html;
        try_files $uri $uri/ /saa/index.html;
    }

    location = /sap {
        return 301 /sap/;
    }

    location /sap/ {
        alias /var/www/sap/;
        index index.html;
        try_files $uri $uri/ /sap/index.html;
    }

    location = /ispm {
        return 301 /ispm/;
    }

    location /ispm/ {
        alias /var/www/ispm/;
        index index.html;
        try_files $uri $uri/ /ispm/index.html;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
