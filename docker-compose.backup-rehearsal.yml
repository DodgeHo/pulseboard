services:
  postgres-source:
    image: ${POSTGRES_IMAGE:-postgres:16-alpine}
    environment:
      POSTGRES_USER: pulseboard
      POSTGRES_PASSWORD: backup-rehearsal-only
      POSTGRES_DB: pulseboard
    volumes:
      - postgres_source_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pulseboard -d pulseboard"]
      interval: 2s
      timeout: 3s
      retries: 30

  postgres-restore:
    image: ${POSTGRES_IMAGE:-postgres:16-alpine}
    environment:
      POSTGRES_USER: pulseboard
      POSTGRES_PASSWORD: backup-rehearsal-only
      POSTGRES_DB: pulseboard_restore
    volumes:
      - postgres_restore_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pulseboard -d pulseboard_restore"]
      interval: 2s
      timeout: 3s
      retries: 30

  migrate-source:
    build:
      context: .
      args:
        NODE_IMAGE: ${NODE_IMAGE:-node:22-bookworm-slim}
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmjs.org/}
        APT_DEBIAN_MIRROR: ${APT_DEBIAN_MIRROR:-}
        APT_SECURITY_MIRROR: ${APT_SECURITY_MIRROR:-}
    command: sh -c "pnpm db:generate && pnpm db:deploy && pnpm db:seed"
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://pulseboard:backup-rehearsal-only@postgres-source:5432/pulseboard?schema=public
      DEMO_API_KEY: pb_backup_rehearsal_key_change_me
      API_KEY_HASH_SALT: backup-rehearsal-only-salt-32-characters-minimum
    depends_on:
      postgres-source:
        condition: service_healthy

volumes:
  postgres_source_data:
  postgres_restore_data:
