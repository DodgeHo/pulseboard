name: Inspect HeatStack Staging

on:
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    environment: tencent-staging
    permissions:
      contents: read
    steps:
      - name: Configure SSH
        env:
          STAGING_HOST: ${{ secrets.TENCENT_STAGING_HOST }}
          STAGING_USER: ${{ secrets.TENCENT_STAGING_USER }}
          STAGING_SSH_KEY: ${{ secrets.TENCENT_STAGING_SSH_KEY }}
          STAGING_KNOWN_HOSTS: ${{ secrets.TENCENT_STAGING_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "$STAGING_HOST"
          test -n "$STAGING_USER"
          test -n "$STAGING_SSH_KEY"
          test -n "$STAGING_KNOWN_HOSTS"

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$STAGING_SSH_KEY" > ~/.ssh/pulseboard_staging
          chmod 600 ~/.ssh/pulseboard_staging
          printf '%s\n' "$STAGING_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

          cat > ~/.ssh/config <<EOF
          Host pulseboard-staging
            HostName $STAGING_HOST
            User $STAGING_USER
            IdentityFile ~/.ssh/pulseboard_staging
            IdentitiesOnly yes
            StrictHostKeyChecking yes
          EOF
          chmod 600 ~/.ssh/config

      - name: Inspect HeatStack runtime and build layout
        run: |
          set -euo pipefail
          ssh pulseboard-staging bash -se <<'REMOTE'
          set -euo pipefail
          app=/var/www/anlan.store/heatstack

          echo '=== Current Nginx HeatStack markers ==='
          sudo grep -n -i -C 4 'heatstack' /etc/nginx/sites-available/anlan.conf || true

          echo '=== HeatStack service metadata (environment values intentionally omitted) ==='
          sudo systemctl show heatstack-api.service \
            --property=Id \
            --property=LoadState \
            --property=ActiveState \
            --property=SubState \
            --property=FragmentPath \
            --property=WorkingDirectory \
            --property=ExecStart \
            --property=EnvironmentFiles \
            --no-pager || true

          echo '=== HeatStack unit structure (Environment lines redacted) ==='
          sudo systemctl cat heatstack-api.service --no-pager 2>/dev/null \
            | sed -E '/^[[:space:]]*Environment=/c\Environment=<redacted>' \
            | sed -E '/^[[:space:]]*EnvironmentFile=/c\EnvironmentFile=<configured; path omitted>' \
            || true

          echo '=== Listening TCP sockets ==='
          sudo ss -ltnp || true

          echo '=== HeatStack top-level and build-related files ==='
          if [ ! -d "$app" ]; then
            echo "missing $app"
            exit 0
          fi
          sudo find "$app" -maxdepth 4 \
            \( -path '*/node_modules' -o -path '*/.git' \) -prune -o \
            \( -type d -o -name 'package.json' -o -name 'astro.config.*' -o -name 'vite.config.*' -o -name 'index.html' -o -name 'manifest.json' \) \
            -printf '%y %p\n' | head -n 360

          echo '=== Workspace and app package manifests ==='
          for manifest in "$app/package.json" "$app/apps/web/package.json" "$app/apps/api/package.json"; do
            if [ -f "$manifest" ]; then
              echo "--- $manifest"
              sudo sed -n '1,260p' "$manifest"
            fi
          done

          echo '=== Deployment descriptors and Astro/Vite config (secret files are never read) ==='
          while IFS= read -r config; do
            echo "--- $config"
            sudo sed -n '1,300p' "$config"
          done < <(sudo find "$app" -maxdepth 5 -type f \
            \( -name 'astro.config.*' -o -name 'vite.config.*' -o -name '*.service' -o -name '*nginx*.conf' -o -name 'nginx.conf' \) \
            ! -name '*.env' -print)

          echo '=== HeatStack web dist tree and identity markers ==='
          sudo find "$app/apps/web/dist" -maxdepth 3 -printf '%y %p\n' 2>/dev/null | head -n 300 || true
          while IFS= read -r index; do
            echo "--- $index"
            sudo grep -Eio "<title>[^<]{0,200}</title>" "$index" | head -n 10 || true
            sudo grep -Eio "(src|href)=['\"][^'\"]{1,240}['\"]" "$index" | head -n 30 || true
          done < <(sudo find "$app/apps/web/dist" -maxdepth 4 -type f -name 'index.html' -print 2>/dev/null)

          echo '=== Public route and API-prefix source markers ==='
          sudo grep -RInE --exclude-dir=node_modules --exclude-dir=.git --exclude='*.map' \
            'base:|site:|outDir|8787|API_BASE|PUBLIC_|/api/' \
            "$app/apps/web" "$app/apps/api" "$app/deploy" 2>/dev/null | head -n 300 || true

          echo '=== Local HeatStack API probes ==='
          for path in / /health /health/live /api/health /api/v1/health; do
            printf -- '--- http://127.0.0.1:8787%s\n' "$path"
            curl -sS --max-time 3 -D - -o /tmp/heatstack-probe-body "http://127.0.0.1:8787$path" | head -n 20 || true
            head -c 500 /tmp/heatstack-probe-body 2>/dev/null | tr '\n' ' ' || true
            printf '\n'
          done
          REMOTE
