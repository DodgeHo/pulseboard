name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11.9.0
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:public
      - run: pnpm verify:artifacts
      - name: Ensure generated public artifacts are up to date
        run: git diff --exit-code -- deploy/anlan/index.html deploy/anlan/demo/index.html deploy/anlan/demo/frontend/index.html
      - run: pnpm typecheck
      - name: Run unit and executable OpenAPI contract tests
        run: pnpm test

  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: pulseboard
          POSTGRES_PASSWORD: pulseboard
          POSTGRES_DB: pulseboard
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pulseboard -d pulseboard"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://pulseboard:pulseboard@localhost:5432/pulseboard?schema=public
      REDIS_URL: redis://localhost:6379
      API_KEY_HASH_SALT: ci-local-only
      DEMO_API_KEY: pb_ci_demo_key_change_me
      WRITE_RATE_LIMIT_MAX: 1000
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11.9.0
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate
      - run: pnpm db:deploy
      - run: pnpm db:seed
      - name: Run API integration and executable OpenAPI contract tests
        run: pnpm test:integration
      - name: Run worker crash-recovery and shutdown integration tests
        env:
          RUN_WORKER_INTEGRATION_TESTS: "true"
          NODE_ENV: test
        run: pnpm --filter @pulseboard/worker test:integration

  backup-restore:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Rehearse PostgreSQL logical backup and isolated restore
        run: bash scripts/postgres-backup-restore-rehearsal.sh

  rollback-rehearsal:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Rehearse immutable-image application rollback
        run: bash scripts/local-compose-rollback-rehearsal.sh
      - name: Upload rollback evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: application-rollback-evidence
          path: .artifacts/application-rollback
          if-no-files-found: ignore
          retention-days: 7

  infrastructure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v4
      - run: terraform fmt -check -recursive infra
      - run: terraform -chdir=infra/aws-lightsail init -backend=false
      - run: terraform -chdir=infra/aws-lightsail validate
