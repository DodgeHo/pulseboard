name: Deploy Tencent Staging

on:
  workflow_dispatch:
    inputs:
      deploy_ref:
        description: Git ref, branch, tag, or SHA to deploy
        required: true
        default: master
      preserve_dirty_worktree:
        description: Archive and stash a dirty staging worktree before deploying
        required: true
        type: boolean
        default: false

concurrency:
  group: tencent-staging
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: tencent-staging
    permissions:
      contents: read
    steps:
      - name: Validate deploy ref
        env:
          DEPLOY_REF: ${{ inputs.deploy_ref }}
        run: |
          set -euo pipefail
          if [ "${#DEPLOY_REF}" -gt 128 ]; then
            echo "deploy_ref must be 128 characters or fewer." >&2
            exit 1
          fi
          case "$DEPLOY_REF" in
            ""|-*|*[^A-Za-z0-9._/@-]*|*..*|*@{*)
              echo "deploy_ref has an unsafe Git ref shape." >&2
              exit 1
              ;;
          esac
          if ! git check-ref-format --allow-onelevel "$DEPLOY_REF"; then
            echo "deploy_ref has an unsafe Git ref shape." >&2
            exit 1
          fi

      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.deploy_ref }}

      - uses: pnpm/action-setup@v6
        with:
          version: 11.9.0

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Build and verify public site artifacts
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile
          pnpm build:public
          pnpm verify:artifacts
          git diff --exit-code -- deploy/anlan/index.html deploy/anlan/demo/index.html deploy/anlan/demo/frontend/index.html

      - name: Configure SSH
        env:
          STAGING_HOST: ${{ secrets.TENCENT_STAGING_HOST }}
          STAGING_USER: ${{ secrets.TENCENT_STAGING_USER }}
          STAGING_SSH_KEY: ${{ secrets.TENCENT_STAGING_SSH_KEY }}
          STAGING_KNOWN_HOSTS: ${{ secrets.TENCENT_STAGING_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "$STAGING_HOST"
          test -n "$STAGING_USER"
          test -n "$STAGING_SSH_KEY"
          test -n "$STAGING_KNOWN_HOSTS"

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$STAGING_SSH_KEY" > ~/.ssh/pulseboard_staging
          chmod 600 ~/.ssh/pulseboard_staging
          printf '%s\n' "$STAGING_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

          cat > ~/.ssh/config <<EOF
          Host pulseboard-staging
            HostName $STAGING_HOST
            User $STAGING_USER
            IdentityFile ~/.ssh/pulseboard_staging
            IdentitiesOnly yes
            StrictHostKeyChecking yes
          EOF
          chmod 600 ~/.ssh/config

      - name: Upload public site assets
        run: |
          set -euo pipefail
          scp deploy/anlan/index.html pulseboard-staging:/tmp/anlan-portal-index.html
          scp deploy/anlan/demo/index.html pulseboard-staging:/tmp/pulseboard-demo-index.html
          scp deploy/anlan/demo/frontend/index.html pulseboard-staging:/tmp/pulseboard-demo-frontend-index.html
          scp deploy/anlan/nginx/anlan.conf pulseboard-staging:/tmp/pulseboard-anlan.conf

      - name: Deploy and verify backend on staging host
        env:
          DEPLOY_REF: ${{ inputs.deploy_ref }}
          PRESERVE_DIRTY_WORKTREE: ${{ inputs.preserve_dirty_worktree }}
        run: |
          set -euo pipefail
          ssh pulseboard-staging bash -se -- "$DEPLOY_REF" "$PRESERVE_DIRTY_WORKTREE" <<'REMOTE'
          set -euo pipefail
          DEPLOY_REF="$1"
          PRESERVE_DIRTY_WORKTREE="$2"
          cd ~/pulseboard

          if [ -n "$(git status --porcelain)" ]; then
            if [ "$PRESERVE_DIRTY_WORKTREE" != "true" ]; then
              echo "Refusing to deploy over a dirty staging worktree." >&2
              echo "Re-run with preserve_dirty_worktree enabled to archive and stash it first." >&2
              git status --short >&2
              exit 1
            fi

            ts=$(date -u +%Y%m%dT%H%M%SZ)
            backup_dir="$HOME/pulseboard-deploy-backups/$ts"
            mkdir -p "$backup_dir"
            git rev-parse HEAD > "$backup_dir/head.txt"
            git status --short > "$backup_dir/status.txt"
            git diff --binary > "$backup_dir/worktree.patch"
            git diff --cached --binary > "$backup_dir/index.patch"
            git ls-files --others --exclude-standard -z > "$backup_dir/untracked-files.zlist"
            if [ -s "$backup_dir/untracked-files.zlist" ]; then
              tar --null --verbatim-files-from -czf "$backup_dir/untracked-files.tar.gz" -T "$backup_dir/untracked-files.zlist"
            fi
            git stash push --include-untracked --message "pre-deploy-$ts"
            test -z "$(git status --porcelain)"
            printf 'Archived dirty staging worktree to %s and Git stash.\n' "$backup_dir"
          fi

          git fetch origin "$DEPLOY_REF"
          git checkout -B master FETCH_HEAD

          sudo env DOCKER_BUILDKIT=0 COMPOSE_DOCKER_CLI_BUILD=0 docker compose -f docker-compose.production.example.yml up --build -d

          wait_for_url() {
            url="$1"
            for attempt in $(seq 1 30); do
              if curl -fsS "$url"; then
                printf '\n'
                return 0
              fi
              sleep 2
            done

            echo "Timed out waiting for $url" >&2
            sudo docker compose -f docker-compose.production.example.yml ps >&2
            sudo docker compose -f docker-compose.production.example.yml logs --tail=80 api >&2
            return 1
          }

          wait_for_url http://127.0.0.1:4000/health/live
          wait_for_url http://127.0.0.1:4000/health/ready

          set -a
          . ./.env
          set +a
          sudo docker compose -f docker-compose.production.example.yml exec -T \
            -e PULSEBOARD_API_URL=http://127.0.0.1:4000 \
            -e DEMO_API_KEY="$DEMO_API_KEY" \
            api pnpm demo:flow

          ts=$(date -u +%Y%m%dT%H%M%SZ)
          if [ -f /var/www/html/index.html ]; then
            sudo cp /var/www/html/index.html /var/www/html/index.html.backup-$ts
          fi
          if [ -f /var/www/html/demo/index.html ]; then
            sudo cp /var/www/html/demo/index.html /var/www/html/demo/index.html.backup-$ts
          fi
          if [ -f /var/www/html/demo/frontend/index.html ]; then
            sudo cp /var/www/html/demo/frontend/index.html /var/www/html/demo/frontend/index.html.backup-$ts
          fi
          for nginx_site in /etc/nginx/sites-available/anlan.conf /etc/nginx/sites-enabled/anlan.conf; do
            if [ ! -f "$nginx_site" ]; then
              echo "Required staging Nginx site file is missing: $nginx_site" >&2
              exit 1
            fi
          done
          if [ -f /etc/nginx/sites-available/anlan.conf ]; then
            sudo cp /etc/nginx/sites-available/anlan.conf /etc/nginx/sites-available/anlan.conf.backup-$ts
          fi
          if [ -f /etc/nginx/sites-enabled/anlan.conf ]; then
            sudo cp /etc/nginx/sites-enabled/anlan.conf /etc/nginx/sites-enabled/anlan.conf.backup-$ts
          fi

          sudo install -d -m 0755 /var/www/html/demo/frontend
          sudo install -m 0644 /tmp/anlan-portal-index.html /var/www/html/index.html
          sudo install -m 0644 /tmp/pulseboard-demo-index.html /var/www/html/demo/index.html
          sudo install -m 0644 /tmp/pulseboard-demo-frontend-index.html /var/www/html/demo/frontend/index.html
          sudo install -m 0644 /tmp/pulseboard-anlan.conf /etc/nginx/sites-available/anlan.conf.candidate-$ts
          sudo install -m 0644 /tmp/pulseboard-anlan.conf /etc/nginx/sites-enabled/anlan.conf.candidate-$ts
          sudo mv /etc/nginx/sites-available/anlan.conf.candidate-$ts /etc/nginx/sites-available/anlan.conf
          sudo mv /etc/nginx/sites-enabled/anlan.conf.candidate-$ts /etc/nginx/sites-enabled/anlan.conf
          if ! sudo nginx -t; then
            echo "Nginx validation failed; restoring both site files from timestamp $ts." >&2
            sudo install -m 0644 /etc/nginx/sites-available/anlan.conf.backup-$ts /etc/nginx/sites-available/anlan.conf
            sudo install -m 0644 /etc/nginx/sites-enabled/anlan.conf.backup-$ts /etc/nginx/sites-enabled/anlan.conf
            sudo nginx -t
            exit 1
          fi
          sudo systemctl reload nginx

          echo "Effective Nginx sources and Anlan route markers:"
          sudo nginx -T 2>&1 | grep -E '^# configuration file|server_name anlan\.store|location = /demo|location /demo/|location = /jobs|location /jobs/' || true
          sudo systemctl show nginx --property=MainPID --property=ExecStart --no-pager

          local_demo_status=$(curl -k -sS -o /dev/null -w '%{http_code}' --resolve anlan.store:443:127.0.0.1 https://anlan.store/demo/)
          printf 'Local Nginx /demo/ status: %s\n' "$local_demo_status"
          if [ "$local_demo_status" != "200" ]; then
            echo "Reloaded Nginx is not serving the reviewed /demo/ contract locally." >&2
            exit 1
          fi
          REMOTE

      - name: Verify portal, PulseBoard demo, and backend surface
        env:
          PUBLIC_BASE_URL: ${{ vars.TENCENT_STAGING_PUBLIC_BASE_URL || 'https://anlan.store' }}
        run: pnpm verify:public
