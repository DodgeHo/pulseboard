server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location = /demo {
        return 301 /demo/;
    }

    location = /demo/health/live {
        proxy_pass http://api:4000/health/live;
        proxy_set_header X-Forwarded-Proto http;
        proxy_set_header X-Request-Id $request_id;
    }

    location = /demo/health/ready {
        proxy_pass http://api:4000/health/ready;
        proxy_set_header X-Forwarded-Proto http;
        proxy_set_header X-Request-Id $request_id;
    }

    location = /demo/openapi.json {
        proxy_pass http://api:4000/openapi.json;
        proxy_set_header X-Forwarded-Proto http;
        proxy_set_header X-Request-Id $request_id;
    }

    location = /demo/docs {
        proxy_pass http://api:4000/docs;
        proxy_set_header X-Forwarded-Proto http;
        proxy_set_header X-Request-Id $request_id;
    }

    location /demo/docs/ {
        proxy_pass http://api:4000/docs/;
        proxy_set_header X-Forwarded-Proto http;
        proxy_set_header X-Request-Id $request_id;
    }

    location /demo/api/v1/ {
        proxy_pass http://api:4000/v1/;
        proxy_set_header X-Forwarded-Proto http;
        proxy_set_header X-Request-Id $request_id;
    }

    location /demo/ {
        try_files $uri $uri/ /demo/index.html;
    }
}
