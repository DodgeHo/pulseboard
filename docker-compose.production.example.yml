services:
  postgres:
    image: ${POSTGRES_IMAGE:-postgres:16-alpine}
    environment:
      POSTGRES_USER: pulseboard
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the server-side .env file}
      POSTGRES_DB: pulseboard
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pulseboard -d pulseboard"]
      interval: 10s
      timeout: 5s
      retries: 12

  redis:
    image: ${REDIS_IMAGE:-redis:7-alpine}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12

  migrate:
    image: ${PULSEBOARD_IMAGE:-pulseboard:local}
    build:
      context: .
      args:
        NODE_IMAGE: ${NODE_IMAGE:-node:22-bookworm-slim}
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmjs.org/}
        APT_DEBIAN_MIRROR: ${APT_DEBIAN_MIRROR:-}
        APT_SECURITY_MIRROR: ${APT_SECURITY_MIRROR:-}
        PULSEBOARD_BUILD_REVISION: ${PULSEBOARD_BUILD_REVISION:-unversioned}
        PULSEBOARD_BUILD_CONTRACT: ${PULSEBOARD_BUILD_CONTRACT:-current}
    command: ["pnpm", "db:deploy"]
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://pulseboard:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the server-side .env file}@postgres:5432/pulseboard?schema=public
      DEMO_API_KEY: ${DEMO_API_KEY:?Set DEMO_API_KEY in the server-side .env file}
      API_KEY_HASH_SALT: ${API_KEY_HASH_SALT:?Set API_KEY_HASH_SALT in the server-side .env file}
    depends_on:
      postgres:
        condition: service_healthy

  api:
    image: ${PULSEBOARD_IMAGE:-pulseboard:local}
    build:
      context: .
      args:
        NODE_IMAGE: ${NODE_IMAGE:-node:22-bookworm-slim}
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmjs.org/}
        APT_DEBIAN_MIRROR: ${APT_DEBIAN_MIRROR:-}
        APT_SECURITY_MIRROR: ${APT_SECURITY_MIRROR:-}
        PULSEBOARD_BUILD_REVISION: ${PULSEBOARD_BUILD_REVISION:-unversioned}
        PULSEBOARD_BUILD_CONTRACT: ${PULSEBOARD_BUILD_CONTRACT:-current}
    command: ["node", "--import", "tsx", "apps/api/src/index.ts"]
    environment:
      NODE_ENV: production
      API_PORT: 4000
      LOG_LEVEL: ${LOG_LEVEL:-info}
      API_SHUTDOWN_TIMEOUT_MS: ${API_SHUTDOWN_TIMEOUT_MS:-10000}
      READINESS_TIMEOUT_MS: ${READINESS_TIMEOUT_MS:-2000}
      METRICS_SCRAPE_TIMEOUT_MS: ${METRICS_SCRAPE_TIMEOUT_MS:-2000}
      DATABASE_URL: postgresql://pulseboard:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the server-side .env file}@postgres:5432/pulseboard?schema=public
      REDIS_URL: redis://redis:6379
      OPERATIONAL_METRICS_REDIS_PREFIX: ${OPERATIONAL_METRICS_REDIS_PREFIX:-pulseboard:operational-metrics:v1}
      API_KEY_HASH_SALT: ${API_KEY_HASH_SALT:?Set API_KEY_HASH_SALT in the server-side .env file}
      CHECK_SCHEDULER_INTERVAL_MS: ${CHECK_SCHEDULER_INTERVAL_MS:-60000}
      HTTP_CHECK_TIMEOUT_MS: ${HTTP_CHECK_TIMEOUT_MS:-5000}
      WRITE_RATE_LIMIT_WINDOW_MS: ${WRITE_RATE_LIMIT_WINDOW_MS:-60000}
      WRITE_RATE_LIMIT_MAX: ${WRITE_RATE_LIMIT_MAX:-120}
    ports:
      - "127.0.0.1:4000:4000"
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/health/live').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12

  worker:
    image: ${PULSEBOARD_IMAGE:-pulseboard:local}
    build:
      context: .
      args:
        NODE_IMAGE: ${NODE_IMAGE:-node:22-bookworm-slim}
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmjs.org/}
        APT_DEBIAN_MIRROR: ${APT_DEBIAN_MIRROR:-}
        APT_SECURITY_MIRROR: ${APT_SECURITY_MIRROR:-}
        PULSEBOARD_BUILD_REVISION: ${PULSEBOARD_BUILD_REVISION:-unversioned}
        PULSEBOARD_BUILD_CONTRACT: ${PULSEBOARD_BUILD_CONTRACT:-current}
    command: ["node", "--import", "tsx", "apps/worker/src/index.ts"]
    environment:
      NODE_ENV: production
      LOG_LEVEL: ${LOG_LEVEL:-info}
      WORKER_SHUTDOWN_TIMEOUT_MS: ${WORKER_SHUTDOWN_TIMEOUT_MS:-10000}
      DATABASE_URL: postgresql://pulseboard:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the server-side .env file}@postgres:5432/pulseboard?schema=public
      REDIS_URL: redis://redis:6379
      OPERATIONAL_METRICS_REDIS_PREFIX: ${OPERATIONAL_METRICS_REDIS_PREFIX:-pulseboard:operational-metrics:v1}
      API_KEY_HASH_SALT: ${API_KEY_HASH_SALT:?Set API_KEY_HASH_SALT in the server-side .env file}
      CHECK_SCHEDULER_INTERVAL_MS: ${CHECK_SCHEDULER_INTERVAL_MS:-60000}
      HTTP_CHECK_TIMEOUT_MS: ${HTTP_CHECK_TIMEOUT_MS:-5000}
      CHECK_EXECUTION_LEASE_MS: ${CHECK_EXECUTION_LEASE_MS:-60000}
      UPTIME_JOB_LOCK_DURATION_MS: ${UPTIME_JOB_LOCK_DURATION_MS:-30000}
      UPTIME_JOB_STALLED_INTERVAL_MS: ${UPTIME_JOB_STALLED_INTERVAL_MS:-30000}
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy


  public-site:
    image: ${PULSEBOARD_IMAGE:-pulseboard:local}
    build:
      context: .
      args:
        NODE_IMAGE: ${NODE_IMAGE:-node:22-bookworm-slim}
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmjs.org/}
        APT_DEBIAN_MIRROR: ${APT_DEBIAN_MIRROR:-}
        APT_SECURITY_MIRROR: ${APT_SECURITY_MIRROR:-}
        PULSEBOARD_BUILD_REVISION: ${PULSEBOARD_BUILD_REVISION:-unversioned}
        PULSEBOARD_BUILD_CONTRACT: ${PULSEBOARD_BUILD_CONTRACT:-current}
    command: >
      sh -c "set -eu;
      ts=$$(date -u +%Y%m%dT%H%M%SZ);
      if [ -f /host-web/index.html ]; then
        cp /host-web/index.html /host-web/index.html.backup-$$ts;
      fi;
      install -m 0644 /app/deploy/anlan/index.html /host-web/index.html;
      mkdir -p /host-web/frontend;
      if [ -f /host-web/frontend/index.html ]; then
        cp /host-web/frontend/index.html /host-web/frontend/index.html.backup-$$ts;
      fi;
      install -m 0644 /app/deploy/anlan/frontend/index.html /host-web/frontend/index.html;
      mkdir -p /host-web/demo/frontend;
      if [ -f /host-web/demo/index.html ]; then
        cp /host-web/demo/index.html /host-web/demo/index.html.backup-$$ts;
      fi;
      install -m 0644 /app/deploy/anlan/demo/index.html /host-web/demo/index.html;
      if [ -f /host-web/demo/frontend/index.html ]; then
        cp /host-web/demo/frontend/index.html /host-web/demo/frontend/index.html.backup-$$ts;
      fi;
      install -m 0644 /app/deploy/anlan/demo/frontend/index.html /host-web/demo/frontend/index.html;
      echo public site installed to /var/www/html/index.html, /var/www/html/frontend/index.html, and /var/www/html/demo/"
    volumes:
      - /var/www/html:/host-web
    restart: "no"

volumes:
  postgres_data:
