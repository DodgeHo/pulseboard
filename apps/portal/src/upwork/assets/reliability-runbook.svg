<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 440" role="img" aria-label="Recovery runbook timeline: health gate, queue retry, restore gate, rollback check, each with its pass condition; simulation runs in the browser only">
  <rect width="1200" height="440" fill="#060817"/>
  <rect x="0.5" y="0.5" width="1199" height="439" fill="none" stroke="#1c426d"/>
  <rect x="0.5" y="0.5" width="1199" height="52" fill="#0b1228"/>
  <line x1="0" y1="52.5" x2="1200" y2="52.5" stroke="#1c426d"/>
  <rect x="28" y="17" width="4" height="18" fill="#61d9a1"/>
  <text x="44" y="31" font-family="Cascadia Mono, Consolas, monospace" font-size="13" font-weight="700" fill="#f4f8ff" letter-spacing="1">RECOVERY RUNBOOK TIMELINE</text>
  <text x="1172" y="31" text-anchor="end" font-family="Cascadia Mono, Consolas, monospace" font-size="10" fill="#7893b2" letter-spacing="1">EXPLICIT SIMULATION — RUNS IN THIS PAGE</text>

  <!-- timeline spine -->
  <line x1="60" y1="180" x2="1140" y2="180" stroke="#1c426d" stroke-width="2"/>

  <!-- step 1 -->
  <g font-family="Cascadia Mono, Consolas, monospace">
    <circle cx="120" cy="180" r="16" fill="#060817" stroke="#61d9a1" stroke-width="2"/>
    <text x="120" y="185" text-anchor="middle" font-size="11" font-weight="700" fill="#61d9a1">01</text>
    <rect x="48" y="96" width="200" height="52" fill="#101b34" stroke="#1c426d"/>
    <text x="64" y="118" font-size="11" font-weight="700" fill="#f4f8ff">HEALTH GATE</text>
    <text x="64" y="136" font-size="9" fill="#7893b2">liveness + readiness respond</text>
    <line x1="120" y1="148" x2="120" y2="164" stroke="#61d9a1"/>
    <text x="120" y="222" text-anchor="middle" font-size="9" fill="#61d9a1" font-weight="700">PASS</text>
    <text x="120" y="244" text-anchor="middle" font-size="9" fill="#a9bdd6">no state change until</text>
    <text x="120" y="260" text-anchor="middle" font-size="9" fill="#a9bdd6">the boundary is confirmed</text>
  </g>

  <!-- step 2 -->
  <g font-family="Cascadia Mono, Consolas, monospace">
    <circle cx="420" cy="180" r="16" fill="#060817" stroke="#61d9a1" stroke-width="2"/>
    <text x="420" y="185" text-anchor="middle" font-size="11" font-weight="700" fill="#61d9a1">02</text>
    <rect x="348" y="96" width="200" height="52" fill="#101b34" stroke="#1c426d"/>
    <text x="364" y="118" font-size="11" font-weight="700" fill="#f4f8ff">QUEUE RETRY</text>
    <text x="364" y="136" font-size="9" fill="#7893b2">BullMQ job retried visibly</text>
    <line x1="420" y1="148" x2="420" y2="164" stroke="#61d9a1"/>
    <text x="420" y="222" text-anchor="middle" font-size="9" fill="#61d9a1" font-weight="700">PASS</text>
    <text x="420" y="244" text-anchor="middle" font-size="9" fill="#a9bdd6">no silent drop,</text>
    <text x="420" y="260" text-anchor="middle" font-size="9" fill="#a9bdd6">retry is a logged decision</text>
  </g>

  <!-- step 3 -->
  <g font-family="Cascadia Mono, Consolas, monospace">
    <circle cx="720" cy="180" r="16" fill="#060817" stroke="#61d9a1" stroke-width="2"/>
    <text x="720" y="185" text-anchor="middle" font-size="11" font-weight="700" fill="#61d9a1">03</text>
    <rect x="648" y="96" width="200" height="52" fill="#101b34" stroke="#1c426d"/>
    <text x="664" y="118" font-size="11" font-weight="700" fill="#f4f8ff">RESTORE GATE</text>
    <text x="664" y="136" font-size="9" fill="#7893b2">restored state is validated</text>
    <line x1="720" y1="148" x2="720" y2="164" stroke="#61d9a1"/>
    <text x="720" y="222" text-anchor="middle" font-size="9" fill="#61d9a1" font-weight="700">PASS</text>
    <text x="720" y="244" text-anchor="middle" font-size="9" fill="#a9bdd6">recovery is not "done"</text>
    <text x="720" y="260" text-anchor="middle" font-size="9" fill="#a9bdd6">until the state checks out</text>
  </g>

  <!-- step 4 -->
  <g font-family="Cascadia Mono, Consolas, monospace">
    <circle cx="1020" cy="180" r="16" fill="#060817" stroke="#ff9d2e" stroke-width="2"/>
    <text x="1020" y="185" text-anchor="middle" font-size="11" font-weight="700" fill="#ff9d2e">04</text>
    <rect x="948" y="96" width="200" height="52" fill="#101b34" stroke="#1c426d"/>
    <text x="964" y="118" font-size="11" font-weight="700" fill="#f4f8ff">ROLLBACK CHECK</text>
    <text x="964" y="136" font-size="9" fill="#7893b2">release boundary verified</text>
    <line x1="1020" y1="148" x2="1020" y2="164" stroke="#ff9d2e"/>
    <text x="1020" y="222" text-anchor="middle" font-size="9" fill="#ff9d2e" font-weight="700">VERIFY</text>
    <text x="1020" y="244" text-anchor="middle" font-size="9" fill="#a9bdd6">reopen the path only</text>
    <text x="1020" y="260" text-anchor="middle" font-size="9" fill="#a9bdd6">after the check passes</text>
  </g>

  <path d="M136 180 h268" stroke="#7893b2" stroke-width="1" stroke-dasharray="3 4" fill="none"/>
  <path d="M436 180 h268" stroke="#7893b2" stroke-width="1" stroke-dasharray="3 4" fill="none"/>
  <path d="M736 180 h268" stroke="#7893b2" stroke-width="1" stroke-dasharray="3 4" fill="none"/>

  <!-- footer -->
  <line x1="34" y1="320" x2="1166" y2="320" stroke="#1c426d"/>
  <g font-family="Cascadia Mono, Consolas, monospace">
    <text x="34" y="352" font-size="10" fill="#ff9d2e" font-weight="700">BOUNDARY</text>
    <text x="130" y="352" font-size="10" fill="#a9bdd6">This timeline mirrors the interactive runbook above the fold on this page. It is a controlled simulation:</text>
    <text x="130" y="374" font-size="10" fill="#a9bdd6">it does not touch a database, a queue, a cloud account, or a production service.</text>
    <text x="34" y="408" font-size="9" fill="#456182" letter-spacing="1">RUN locally FOR REAL: postgres backup-restore rehearsal + rollback rehearsal scripts in the pulseboard repository</text>
  </g>
</svg>
